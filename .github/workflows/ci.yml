name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: legisdata
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legisdata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/legisdata
      AUTH_SECRET: ci-only-secret-change-me
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run fixture:validate
      - run: npm run db:migrate
      - run: npm run db:import
      - run: npm run db:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
        env:
          DATABASE_URL: ""
          AUTH_TRUST_HOST: "true"
          PLAYWRIGHT_USE_BUILD: "1"
      - run: npm run test:e2e -- --workers=2
        name: Browser tests with PostgreSQL and Auth.js session
        env:
          AUTH_TRUST_HOST: "true"
          PLAYWRIGHT_USE_BUILD: "1"
