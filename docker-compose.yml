services:
  postgres:
    image: postgres:16-alpine
    container_name: legisdata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legisdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - legisdata-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legisdata"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  legisdata-postgres:
