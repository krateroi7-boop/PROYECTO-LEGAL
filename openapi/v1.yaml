openapi: 3.0.3
info:
  title: Legisdata API
  version: 1.0.0
  description: Lectura publicada, descubrimiento selectivo de metadatos y resolución exacta. Sólo resolver conserva capturas y crea propuestas editoriales internas.
servers:
  - url: https://example.com
tags:
  - name: Normas
  - name: Búsqueda
  - name: Fuentes
paths:
  /api/v1/descubrir:
    get:
      tags: [Fuentes, Búsqueda]
      summary: Descubre hasta diez candidatos BCN sin descargar texto XML
      description: Requiere BCN_DISCOVERY_ENABLED. Un número aislado representa número de ley. La respuesta vacía no acredita inexistencia ni exhaustividad. No acepta SPARQL del usuario.
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
          example: Ley de transparencia
      responses:
        '200':
          description: Candidatos, lista vacía o función desactivada; comprobar data.status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryEnvelope' }
        '202':
          description: Consulta en curso; comprobar Retry-After, sin sondear más de treinta segundos
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiscoveryEnvelope' }
        '400':
          description: Consulta inválida
        '429':
          description: Límite local de solicitudes
        '503':
          description: Fuente o persistencia temporalmente no disponible; no representa ausencia
          headers:
            Retry-After:
              schema: { type: string }
  /api/v1/fuentes:
    get:
      tags: [Fuentes]
      summary: Capacidades declaradas y limitaciones de los conectores
      responses:
        '200':
          description: Registro estático; no certifica disponibilidad o autorización de uso actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /api/v1/resolver:
    get:
      tags: [Fuentes]
      summary: Resuelve una referencia exacta BCN con caché y revisión editorial
      description: Puede consultar la fuente y persistir una propuesta. Nunca devuelve el texto pendiente de revisión. Las respuestas no admiten caché HTTP.
      parameters:
        - in: query
          name: referencia
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
          example: Ley 19.880
        - in: query
          name: discovery
          description: Correlación opaca devuelta por descubrir; sólo cuenta una selección válida por búsqueda
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Versión publicada disponible; puede estar pendiente una actualización
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolutionEnvelope' }
        '202':
          description: Estado resolving (reserva en curso) o pending_review (captura conservada); son estados diferentes
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolutionEnvelope' }
        '400':
          description: Referencia inválida
        '404':
          description: Ausencia confirmada por la fuente, temporalmente cacheada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolutionEnvelope' }
        '429':
          description: Límite local de solicitudes excedido
        '503':
          description: Persistencia o fuente no disponible; puede incluir Retry-After
          headers:
            Retry-After:
              schema: { type: string }
  /api/v1/normas:
    get:
      tags: [Normas]
      summary: Lista normas publicadas
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /api/v1/normas/{slug}:
    get:
      tags: [Normas]
      summary: Obtiene una norma y su versión vigente
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Norma estructurada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          description: La representación no ha cambiado
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/normas/{slug}/articulos/{stableKey}:
    get:
      tags: [Normas]
      summary: Obtiene un nodo jurídico de la versión vigente
      parameters:
        - $ref: '#/components/parameters/Slug'
        - $ref: '#/components/parameters/StableKey'
      responses:
        '200':
          description: Nodo jurídico
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '304':
          description: La representación no ha cambiado
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/normas/{slug}/versiones:
    get:
      tags: [Normas]
      summary: Lista versiones de una norma
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Versiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /api/v1/normas/{slug}/versiones/{versionId}:
    get:
      tags: [Normas]
      summary: Obtiene una versión histórica específica
      parameters:
        - $ref: '#/components/parameters/Slug'
        - in: path
          name: versionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Versión estructurada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/normas/{slug}/relaciones:
    get:
      tags: [Normas]
      summary: Lista relaciones verificadas de una norma
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Relaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /api/v1/buscar:
    get:
      tags: [Búsqueda]
      summary: Busca en el corpus publicado
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 500 }
        - in: query
          name: number
          schema: { type: string, maxLength: 100 }
        - in: query
          name: article
          schema: { type: string, maxLength: 200 }
        - in: query
          name: type
          schema: { type: string, maxLength: 100 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Resultados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
components:
  headers:
    ETag:
      description: Identificador de la representación para cache condicional.
      schema: { type: string }
  parameters:
    Slug:
      in: path
      name: slug
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    StableKey:
      in: path
      name: stableKey
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9._-]+$' }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    DatabaseUnavailable:
      description: Persistencia no disponible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    SearchCandidate:
      type: object
      required: [source, resourceUri, match, provenance]
      properties:
        source: { type: string }
        resourceUri: { type: string, format: uri }
        externalId: { type: string, pattern: '^[1-9][0-9]{0,11}$' }
        reference:
          type: object
          properties:
            kind: { type: string, enum: [idNorma] }
            value: { type: string }
        title: { type: string }
        number: { type: string }
        type: { type: string }
        publicationDate: { type: string, format: date }
        sourceUrl: { type: string, format: uri }
        organisms:
          type: array
          items:
            type: object
            required: [uri]
            properties:
              uri: { type: string, format: uri }
              name: { type: string }
        match:
          type: object
          description: Explicación calculada por Legisdata; no metadato oficial
          properties:
            strategy: { type: string, enum: [number, title, subject, alias, identifier] }
            fields: { type: array, items: { type: string } }
        provenance:
          type: object
          properties:
            endpoint: { type: string, format: uri }
            observedAt: { type: string, format: date-time }
            adapterVersion: { type: string }
        local:
          type: object
          description: Publicación enlazada por identidad externa verificada
          properties:
            slug: { type: string }
            versionId: { type: string, format: uuid }
            needsRevalidation: { type: boolean }
    DiscoveryEnvelope:
      type: object
      required: [data, meta]
      properties:
        meta: { type: object }
        data:
          type: object
          required: [status, candidates, cache]
          properties:
            status: { type: string, enum: [available, empty, unavailable, in_progress] }
            candidates: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/SearchCandidate' } }
            cache: { type: string, enum: [hit, negative, fetched, stale, none] }
            checkedAt: { type: string, format: date-time }
            retryAfterSeconds: { type: integer }
            reason: { type: string }
            eventId: { type: string, format: uuid }
    ResolutionEnvelope:
      type: object
      required: [data, meta]
      properties:
        meta: { type: object }
        data:
          type: object
          required: [status, cache, source, reference, checkedAt]
          properties:
            status: { type: string, enum: [published, pending_review, resolving, not_found, unavailable] }
            cache: { type: string, enum: [hit, fetched, revalidated, stale, negative, none] }
            source: { type: string }
            reference:
              type: object
              required: [kind, value]
              properties:
                kind: { type: string, enum: [idNorma, idLey] }
                value: { type: string }
            checkedAt: { type: string, format: date-time, nullable: true }
            sourceUrl: { type: string, format: uri }
            slug: { type: string }
            versionId: { type: string, format: uuid }
            retryAfterSeconds: { type: integer, minimum: 1 }
            reason: { type: string }
            proposal:
              type: object
              description: Ficha editorial limitada; nunca incluye texto, nodos ni original pendiente
              required: [id, requestable]
              properties:
                id: { type: string, format: uuid }
                title: { type: string }
                number: { type: string }
                type: { type: string }
                publicationDate: { type: string }
                organisms: { type: array, items: { type: string } }
                requestable: { type: boolean }
    Envelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          type: object
          properties:
            requestId: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
